<header class="w-full bg-cream px-4 shadow-sm relative z-50">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    <a
      href="/"
      class="flex items-center gap-1 hover:opacity-80 transition-opacity"
    >
      <img
        src="/assets/ur-kitchen-logo.svg"
        alt="UR-Kitchen Icon"
        class="w-16 h-16"
      />
      <span class="text-2xl font-heading font-bold text-truffle tracking-tight"
        >UR-Kitchen</span
      >
    </a>

    <nav class="hidden md:flex gap-8">
      <a
        id="nav-about"
        href="/#about"
        class="text-truffle font-bold hover:text-olio-gold transition-colors"
        >About US</a
      >
      <a
        href="/recipe-box/"
        class="text-truffle font-bold hover:text-olio-gold transition-colors"
        >My Recipe Box</a
      >
    </nav>

    <button
      id="mobile-btn"
      class="md:hidden relative w-10 h-10 flex items-center justify-center focus:outline-none z-50"
    >
      <span
        class="hamburger-line w-8 h-0.5 bg-truffle rounded transition-all duration-300 relative block"
      ></span>
    </button>
  </div>
</header>
