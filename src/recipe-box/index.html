<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Recipe Box</title>
    <meta
      name="description"
      content="Your recipe box for nutritious healthy and affordable meals"
    />
    <meta name="author" content="Ohotuowo Morgan Agrinya" />

    <link rel="icon" type="image/svg+xml" href="/assets/ur-kitchen-logo.svg" />
    <link rel="apple-touch-icon" href="/assets/ur-kitchen-logo.svg" />

    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://ur-kitchen.vercel.app/recipe-box/"
    />
    <meta property="og:title" content="My Recipe Box" />
    <meta
      property="og:description"
      content="Turn the random ingredients in your kitchen into delicious, healthy, budget-friendly meals."
    />
    <meta
      property="og:image"
      content="https://ur-kitchen.vercel.app/assets/home.jpg"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:url"
      content="https://ur-kitchen.vercel.app/recipe-box/"
    />
    <meta name="twitter:title" content="My Recipe Box" />
    <meta
      name="twitter:description"
      content="Turn the random ingredients in your kitchen into delicious, healthy, budget-friendly meals."
    />
    <meta
      name="twitter:image"
      content="https://ur-kitchen.vercel.app/assets/home.jpg"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body class="bg-white">
    <div id="header-container"></div>

    <main class="min-h-screen">
      <section class="bg-truffle py-16 px-6 border-b border-truffle/10">
        <div class="max-w-4xl mx-auto text-center">
          <h1
            class="text-3xl md:text-5xl font-heading font-bold text-olio-gold mb-4"
          >
            My Recipe Box
          </h1>
          <p class="text-base md:text-lg text-cream font-medium">
            Your personal collection of culinary masterpieces.
          </p>
        </div>
      </section>

      <section class="max-w-6xl mx-auto px-6 py-16">
        <div id="empty-state" class="hidden text-center py-20">
          <svg
            class="w-24 h-24 mx-auto text-truffle/20 mb-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
            ></path>
          </svg>
          <h3 class="text-2xl font-heading font-bold text-truffle mb-2">
            Your box is empty!
          </h3>
          <p class="text-truffle/70 mb-8">
            Go match some ingredients to find your next meal.
          </p>
          <a
            href="/match-ingredients/"
            class="bg-olio-gold text-truffle font-bold py-3 px-8 rounded-lg shadow-md hover:bg-truffle hover:text-olio-gold transition-colors"
          >
            Find Recipes
          </a>
        </div>

        <div
          id="saved-grid"
          class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-8"
        ></div>
      </section>
    </main>

    <div
      id="recipe-modal"
      class="fixed inset-0 z-100 hidden flex items-center justify-center bg-truffle/80 backdrop-blur-sm p-4 opacity-0 transition-opacity duration-300"
    >
      <div
        class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[90vh] overflow-y-auto relative transform scale-95 transition-transform duration-300"
        id="modal-content-container"
      >
        <button
          id="close-modal-btn"
          class="absolute top-4 right-4 bg-white/80 hover:bg-truffle hover:text-white text-truffle rounded-full p-2 transition-colors z-20 shadow-sm"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </button>
        <div id="modal-body" class="p-0"></div>
      </div>
    </div>

    <div id="footer-container"></div>
    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/box.js"></script>
  </body>
</html>
